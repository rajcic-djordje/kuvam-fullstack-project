<main class="home-page">
  <section class="hero container">
    <div class="hero-content">
      <div class="hero-text">
        <h1>
          Domaća hrana
          <span>iz tvoje okoline</span>
        </h1>

        <p class="hero-description">
          Pronađi ukusna kuvana jela, peciva, kolače, zimnicu i još mnogo toga
          od proverenih domaćina u tvom kraju.
        </p>

        <form class="search-form">
          <div class="search-field">
            <img src="/icons/search.svg" alt="" class="search-icon">

            <input
              type="search"
              placeholder="Pretraži jela, proizvode ili prodavce..."
              aria-label="Pretraži ponude"
            >
          </div>

          <button type="submit">
            <img src="/icons/search.svg" alt="">
            <span>Pretraži</span>
          </button>
        </form>

        <div class="hero-benefits">
          <div class="benefit">
            <img src="/icons/shield-check.svg" alt="">
            <div>
              <strong>Provereni domaćini</strong>
              <span>Kvalitet kojem možeš da veruješ</span>
            </div>
          </div>

          <div class="benefit">
            <img src="/icons/leaf.svg" alt="">
            <div>
              <strong>Sveže i domaće</strong>
              <span>Pripremljeno s ljubavlju</span>
            </div>
          </div>

          <div class="benefit">
            <img src="/icons/geo-alt.svg" alt="">
            <div>
              <strong>Iz tvoje okoline</strong>
              <span>Brzo i jednostavno preuzimanje</span>
            </div>
          </div>
        </div>
      </div>

      <div class="hero-image">
        <img src="/images/hero-food.png" alt="Domaća hrana i proizvodi">
      </div>
    </div>
  </section>
</main>
