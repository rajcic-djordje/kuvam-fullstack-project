<header class="navbar">
  <div class="container navbar-container">
    <a
      class="logo-link"
      routerLink="/"
      aria-label="Kuvam početna stranica"
    >
      <img
        class="logo"
        src="/images/kuvam-logo.png"
        alt="Kuvam"
      >
    </a>

    <nav class="nav-links" aria-label="Glavna navigacija">
      <a
        class="nav-link"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Početna
      </a>

      <a
        class="nav-link"
        routerLink="/offers"
        routerLinkActive="active"
      >
        Ponude
      </a>
    </nav>

    <div class="nav-actions">
      @if (authService.isAuthenticated()) {
        <div class="profile-menu">
          <button
            class="profile-trigger"
            type="button"
            [class.open]="isProfileMenuOpen()"
            [attr.aria-expanded]="isProfileMenuOpen()"
            aria-haspopup="menu"
            (click)="toggleProfileMenu()"
          >
            <span class="profile-avatar">
              <img
                class="user-icon"
                src="/icons/person.svg"
                alt=""
              >
            </span>

            <span class="profile-name">
              {{ authService.currentUser()?.firstName }}
            </span>

            <span class="profile-chevron" aria-hidden="true"></span>
          </button>

          @if (isProfileMenuOpen()) {
            <div class="profile-dropdown" role="menu">
              <div class="profile-summary">
                <strong>
                  {{ authService.currentUser()?.firstName }}
                  {{ authService.currentUser()?.lastName }}
                </strong>

                <span>
                  {{ authService.currentUser()?.email }}
                </span>
              </div>

              <div class="dropdown-divider"></div>

              <a
                class="dropdown-item"
                routerLink="/profile"
                role="menuitem"
                (click)="closeProfileMenu()"
              >
                <img
                  src="/icons/person.svg"
                  alt=""
                >

                <span>Moj profil</span>
              </a>

              <button
                class="dropdown-item logout-item"
                type="button"
                role="menuitem"
                (click)="logout()"
              >
                <span class="logout-icon" aria-hidden="true"></span>
                <span>Odjava</span>
              </button>
            </div>
          }
        </div>
      } @else {
        <a
          class="login-link"
          routerLink="/login"
        >
          Prijava
        </a>

        <a
          class="register-button"
          routerLink="/register"
        >
          <img
            class="user-icon"
            src="/icons/person.svg"
            alt=""
          >

          <span>Registracija</span>
        </a>
      }
    </div>
  </div>
</header>
